<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilidad Matemática - ECOEMS 2026 | Series Espaciales</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #a855f7; /* Púrpura para Series Espaciales */
            --primary-hover: #9333ea;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --hint-bg: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #c084fc;
            --border: #334155;
            --hint-bg: #2d3748;
            --glass: rgba(30, 41, 59, 0.8);
        }

        * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .navbar {
            width: 100%; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        .nav-tools { display: flex; align-items: center; gap: 12px; }

        .timer-container {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 12px;
        }

        .timer-box { font-variant-numeric: tabular-nums; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        .main-container { max-width: 900px; width: 95%; margin: 1.5rem 0; flex-grow: 1; }

        .subindex-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .subindex-nav::-webkit-scrollbar { display: none; }

        .tab {
            padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer; white-space: nowrap; font-weight: 500;
            color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 6px;
        }

        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab.completed { border-color: var(--secondary); color: var(--secondary); }
        .tab.locked { opacity: 0.5; cursor: not-allowed; background: #e5e7eb; }

        .quiz-card {
            background: var(--card); border-radius: 20px; padding: 2.5rem;
            box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 550px;
            position: relative;
        }

        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
        .module-title { font-weight: 700; font-size: 1.1rem; color: var(--primary); }

        .progress-bar-wrap { height: 6px; background: var(--bg); border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); transition: width 0.4s; }

        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.4; }

        .options-grid { display: grid; gap: 12px; margin-bottom: 1.5rem; }
        @media (min-width: 768px) { .options-grid { grid-template-columns: 1fr 1fr; } }

        .option-btn {
            background: var(--bg); border: 2px solid var(--border); padding: 1rem;
            border-radius: 12px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .option-btn.correct { border-color: var(--secondary); background: rgba(16, 185, 129, 0.1); color: var(--secondary); }
        .option-btn.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .letter { width: 28px; height: 28px; background: var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .correct .letter { background: var(--secondary); color: white; }
        .incorrect .letter { background: var(--danger); color: white; }

        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; justify-content: center; transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: none; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger-outline { background: none; border: 1px solid var(--danger); color: var(--danger); }
        .btn-ghost { background: none; color: var(--text-muted); border: none; }

        .info-box { margin-top: 1rem; padding: 1.25rem; border-radius: 12px; font-size: 0.95rem; border-left: 4px solid var(--primary); line-height: 1.5; }
        .hint-box { background: var(--hint-bg); border-color: var(--warning); font-style: italic; color: var(--text-main); }
        .explanation-box { background: rgba(168, 85, 247, 0.05); }

        .stats-panel { text-align: center; animation: fadeIn 0.5s; }
        .stat-circle { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; border: 8px solid var(--border); }
        .stat-circle.high { border-color: var(--secondary); color: var(--secondary); }
        .stat-circle.low { border-color: var(--danger); color: var(--danger); }

        .review-list { text-align: left; margin: 1.5rem 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .review-item { padding: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--card); }
        .review-item:last-child { border-bottom: none; }
        .review-item:hover { background: var(--bg); }

        table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 0.95rem; }
        th, td { padding: 14px; border-bottom: 1px solid var(--border); text-align: center; }
        th { background: var(--bg); font-weight: 700; color: var(--text-muted); }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .footer {
            width: 100%;
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        
        .footer strong {
            color: var(--primary);
        }
        
        @media (max-width: 600px) {
            .quiz-card { padding: 1.25rem; min-height: 650px; }
            .navbar { padding: 1rem; }
            .module-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

<script>
    // --- CONSTANTES ---

    const modulos = [

                { q: "¿Qué son exactamente las 'Series Espaciales'?", o: ["Sucesiones de números primos", "Secuencias de figuras con transformaciones sistemáticas", "Ecuaciones de segundo grado", "Figuras sin ningún orden estructural"], c: 1, e: "Son secuencias visuales de figuras que siguen patrones repetitivos y predecibles.", h: "Patrones visuales y geométricos." },
                { q: "Una transformación principal es la 'Rotación'. ¿Cuáles son los ángulos más comunes en el examen?", o: ["45°, 90°, 180°, 270°", "33°, 66°", "10°, 20°", "Solo giros completos de 360°"], c: 0, e: "Las figuras suelen girar en fracciones exactas de círculo: cuartos o medias vueltas.", h: "Piensa en las horas de un reloj." },
                { q: "Si una figura se voltea como si estuviera frente a un espejo, la transformación es una:", o: ["Rotación", "Sucesión", "Reflexión (eje vertical u horizontal)", "Traslación simple"], c: 2, e: "La reflexión invierte la figura proyectándola sobre un eje simétrico (efecto espejo).", h: "Efecto espejo." },
                { q: "El Paso 1 del Método BioReto Academy es 'Identificar Elementos'. Esto implica ver:", o: ["El resultado final primero", "Si la figura es simétrica", "La forma base, elementos internos y posición", "Solo contar los lados"], c: 2, e: "Antes de ver cómo cambia, debes saber QUÉ elementos estructurales componen la figura.", h: "Reconocer todas las partes." },
                { q: "El Paso 2 es 'Analizar Transformaciones'. Consiste en:", o: ["Dibujar la figura en papel", "Observar si hay rotaciones, reflejos o cambios progresivos", "Saltar a otra pregunta", "Medir la figura con regla"], c: 1, e: "Una vez identificados los elementos, analizas cómo cambian paso a paso de una viñeta a otra.", h: "Ver el movimiento." },
                { q: "El Paso 3, 'Verificar el Patrón', es crucial porque:", o: ["Asegura que la regla lógica funcione para toda la serie", "Te permite borrar todo", "Es lo que te da los puntos", "Demuestra que sabes dibujar"], c: 0, e: "No basta con que funcione para la figura 1 y 2; debes confirmar que la regla aplica consistentemente a toda la secuencia.", h: "Confirmar consistencia." },

                { q: "Sucesión numérica aplicada: Si la figura 1 tiene 2 líneas, la figura 2 tiene 4 y la 3 tiene 6, es una:", o: ["Rotación espacial continua", "Sucesión matemática aplicada a figuras visuales", "Reflexión vertical", "Ilusión óptica"], c: 1, e: "Aplica una regla aritmética (+2 líneas) al entorno geométrico.", h: "Patrón matemático escondido." },
                { q: "En una rotación de 180°, un triángulo que apunta hacia ARRIBA terminará apuntando hacia:", o: ["Arriba", "Derecha", "Abajo", "Izquierda"], c: 2, e: "180° equivale a dar media vuelta completa, invirtiendo la dirección original.", h: "Media vuelta de volante." },
                { q: "El objetivo principal de resolver series espaciales es poner a prueba tu:", o: ["Memoria de fechas históricas", "Habilidad de percepción y análisis visual", "Cálculo mental algebraico", "Comprensión lectora"], c: 1, e: "El examen evalúa cómo tu cerebro procesa, descompone y predice movimientos geométricos.", h: "Ojo analítico." }

                { q: "En el Análisis Sistemático, la 'Capa 1' corresponde a:", o: ["Puntos y líneas finas", "Figura, forma o contenedor principal", "Colores de fondo", "El sombreado"], c: 1, e: "Siempre se empieza identificando y analizando el comportamiento de la estructura más grande o externa.", h: "El contorno exterior." },
                { q: "Una vez analizada la Capa 1, la 'Capa 2' se enfoca en:", o: ["El sombreado general", "Elementos internos (puntos, cruces, su posición)", "La rotación externa total", "El tamaño de las respuestas"], c: 1, e: "Después del contorno exterior, te fijas en cómo se mueven o cambian los detalles de adentro.", h: "Lo que viaja en el interior." },
                { q: "Si la forma principal es Cuadrado → Rombo → Círculo. En la 'Capa 3' podrías notar:", o: ["La cantidad de lados", "El tamaño del papel", "Atributos visuales como grosor de bordes o tipo de sombreado", "Puntos extras"], c: 2, e: "Los atributos estéticos (grosor, color, relleno) completan el análisis final de las capas.", h: "Detalles estéticos finales." },
                { q: "Si una serie alterna el relleno (Blanco, Negro, Blanco...) y te piden la 6ta figura, el relleno será:", o: ["Negro", "Blanco", "Gris", "Ajedrez"], c: 0, e: "Posiciones impares (1,3,5) = Blanco; posiciones pares (2,4,6) = Negro.", h: "Piensa en números pares e impares." },
                { q: "Si un punto se mueve por las 4 esquinas de un cuadrado consecutivamente (Arriba-Der, Abajo-Der...), su patrón es:", o: ["Aparición cíclica", "Posición estática", "Rotación interna de esquinas (90°)", "Reflexión central"], c: 2, e: "El elemento interno está rotando de forma independiente respecto a las esquinas del contenedor principal.", h: "Viaje por los vértices." },
                { q: "En rotaciones espaciales, girar en sentido 'antihorario' significa:", o: ["A favor de las manecillas del reloj", "En contra de las manecillas del reloj (hacia la izquierda)", "Hacia el eje superior", "Mantenerse fijo"], c: 1, e: "Antihorario es girar hacia la izquierda, la dirección opuesta al movimiento de un reloj analógico.", h: "Al revés del reloj." },
                { q: "Identificar que una serie tiene un 'ciclo de 4 figuras' significa que:", o: ["La figura 5 será exactamente igual a la figura 1", "Todas las figuras son círculos", "La figura 4 es la respuesta final", "Se le restan 4 puntos"], c: 0, e: "El patrón visual se reinicia por completo después de completar 4 transformaciones.", h: "Se repite la historia." }
            ]
        },
        {
            id: 2,
            titulo: "Conteo de Figuras",
            preguntas: [
                { q: "El Ejercicio 11 del video se enfoca en 'Conteo y Visualización'. ¿Cuál es el objetivo principal de este tipo de reactivo?", o: ["Medir el tiempo de respuesta", "Contar puntos internos aislados", "Identificar cuántas figuras geométricas específicas están ocultas o superpuestas en una imagen global", "Leer un diagrama de flujo"], c: 2, e: "Evalúa tu capacidad para abstraer y separar figuras individuales dentro de una estructura compleja superpuesta.", h: "Hallar formas ocultas." },
                { q: "El Paso 1 de la Estrategia de Conteo Sistemático de CyberEdu es:", o: ["Sumar todo lo que veas rápido", "Contar separando por tamaños (grandes, medianos, pequeños)", "Usar una regla de plástico", "Elegir siempre la opción más alta"], c: 1, e: "Clasificar sistemáticamente por tamaño evita que omitas figuras estructurales o cuentes una figura dos veces.", h: "Ordenar de mayor a menor." },
                { q: "El Paso 2 menciona el 'Método de capas' para conteo. Esto se refiere a:", o: ["Pintar la figura mentalmente", "Identificar planos de profundidad: figuras frontales y figuras traseras", "Cortar la hoja del examen", "Contar solo los vértices visibles"], c: 1, e: "Te ayuda a percibir la ilusión de profundidad, separando mentalmente lo que está 'adelante' de lo que está 'atrás'.", h: "Adelante y atrás." },
                { q: "El Paso 3 indica 'Verificar por agrupamientos'. ¿Por qué es fundamental este paso?", o: ["Para perder el tiempo", "Porque muchas figuras válidas se forman por la intersección y unión de otras más pequeñas", "Porque siempre la respuesta es 'C'", "Para borrar marcas del lápiz"], c: 1, e: "Las 'trampas' del examen suelen ser figuras nuevas que nacen al juntar 2, 3 o 4 figuras base.", h: "Uniones e intersecciones." },
                { q: "El Paso 4 en el conteo sistemático es:", o: ["Rendirse si hay muchas", "Totalizar con organización categórica (sumar los parciales)", "Multiplicar el ancho por la altura", "Restar la base al final"], c: 1, e: "Sumar ordenadamente tus hallazgos por categorías (ej. 2 grandes + 4 medianas + 3 agrupaciones) garantiza precisión.", h: "Suma final ordenada." },
                { q: "Un error sumamente común y evitable al contar cuadrados en una cuadrícula grande es:", o: ["Contar los rectángulos alargados por accidente", "Olvidar contar el gran cuadrado exterior que engloba a todos los pequeños", "Usar lápiz en lugar de pluma", "Contar demasiado lento"], c: 1, e: "El borde exterior o 'marco' también forma una figura válida que la mayoría de los estudiantes olvida sumar.", h: "El contorno total." },
                { q: "La diferencia conceptual clave entre las 'Series Espaciales' (Ejercicios 6 al 8) y el 'Conteo de Figuras' (Ejercicio 11) es:", o: ["Las series predicen un movimiento futuro (dinámico); el conteo analiza una imagen estática presente", "Las series usan letras y el conteo números", "El conteo es nivel secundaria y las series nivel preparatoria", "No hay diferencia real"], c: 0, e: "Las series requieren lógica secuencial (qué pasará); el conteo requiere abstracción profunda (qué hay aquí).", h: "Movimiento vs Fotografía." },
                { q: "El Video 7 (Series Espaciales) representa el 'Segundo Pilar' de la materia de:", o: ["Biología Celular", "Química Analítica", "Habilidad Matemática / Razonamiento Lógico", "Historia de México"], c: 2, e: "Junto con las sucesiones numéricas, forma la base del razonamiento lógico-matemático del examen.", h: "Rama de la lógica." },
                { q: "Según el avance al final del video, el siguiente paso evolutivo en el entrenamiento (Video 8) será:", o: ["Álgebra básica", "Imaginación Espacial (Proyección de 2D a 3D)", "Sucesiones alfanuméricas", "Lectura de comprensión rápida"], c: 1, e: "El siguiente reto lógico es proyectar y rotar el análisis visual estático hacia objetos tridimensionales (dados, armados).", h: "Pensamiento tridimensional." },
                { q: "La recomendación fundamental de CyberEdu para estructurar tu análisis visual bajo presión de tiempo es:", o: ["Dejar todo a la primera impresión o intuición", "Usar el método de capas, análisis separado y totalización sistemática para evitar sesgos", "Memorizar todas las figuras posibles del mundo", "Marcar rápido cualquier opción con figura simétrica"], c: 1, e: "Bajo estrés, la intuición falla. Ser estrictamente sistemático reduce drásticamente el margen de error y las 'ilusiones ópticas'.", h: "Sigue el método riguroso." }
            ]
        }
    ];

    // --- STATE MANAGEMENT ---
    let state = {
        moduloActual: 0,
        preguntaActual: 0,
        respuestas: Array(3).fill().map(() => Array(10).fill(null)),
        tiempos: Array(3).fill(0),
        completado: Array(3).fill(false),
        isPaused: false,
        isDark: false,
        showHint: false,
        started: false
    };

    let ticker = null;

    // --- FUNCIONES CORE ---

    function init() {
        lucide.createIcons();
        load();
        renderTabs();
        renderCurrent();
        startTicker();
    }

    function load() {
        const saved = localStorage.getItem('ecoems_2026_series_espaciales');
        if (saved) {
            state = { ...state, ...JSON.parse(saved) };
            if (state.isDark) document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeIcon();
        }
    }

    function save() {
        localStorage.setItem('ecoems_2026_series_espaciales', JSON.stringify(state));
    }

    function toggleTheme() {
        state.isDark = !state.isDark;
        document.documentElement.setAttribute('data-theme', state.isDark ? 'dark' : 'light');
        updateThemeIcon();
        save();
    }

    function updateThemeIcon() {
        const icon = document.getElementById('theme-icon');
        if (icon) {
            icon.setAttribute('data-lucide', state.isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }
    }

    function startTicker() {
        if (ticker) clearInterval(ticker);
        ticker = setInterval(() => {
            if (!state.isPaused && state.started && isUnlocked(state.moduloActual) && !state.completado[state.moduloActual]) {
                state.tiempos[state.moduloActual]++;
                updateTimerDisplay();
                if (state.tiempos[state.moduloActual] % 5 === 0) save();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const t = state.tiempos[state.moduloActual];
        const m = Math.floor(t / 60);
        const s = t % 60;
        const display = document.getElementById('time-string');
        if (display) {
            display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
    }

    function togglePause() {
        state.isPaused = !state.isPaused;
        const btn = document.getElementById('timer-ctrl');
        if (btn) {
            btn.innerHTML = `<i data-lucide="${state.isPaused ? 'play' : 'pause'}" size="16"></i>`;
            lucide.createIcons();
        }
    }

    function isUnlocked(idx) {
        if (idx === 0) return true;
        return state.completado[idx - 1];
    }

    function renderTabs() {
        const nav = document.getElementById('subindex-nav');
        if (!nav) return;
        nav.innerHTML = SUBINDICES.map((name, i) => {
            const unlocked = isUnlocked(i);
            let cls = `tab ${i === state.moduloActual ? 'active' : ''} ${state.completado[i] ? 'completed' : ''}`;
            if (!unlocked) cls += ' locked';
            const icon = unlocked ? (state.completado[i] ? 'check-circle' : 'circle') : 'lock';
            return `<button class="${cls}" onclick="changeModule(${i})"><i data-lucide="${icon}" size="14"></i> ${i + 1}. ${name}</button>`;
        }).join('');
        lucide.createIcons();
    }

    function changeModule(i) {
        if (!isUnlocked(i)) return;
        state.moduloActual = i;
        state.preguntaActual = 0;
        state.showHint = false;
        state.isPaused = false;
        renderTabs();
        renderCurrent();
        updateTimerDisplay();
        save();
    }

    function resetModule(auto = false) {
        if (!auto && !confirm("¿Seguro que quieres reiniciar este módulo? Perderás tus respuestas y el tiempo de esta sección.")) return;
        
        state.respuestas[state.moduloActual] = Array(10).fill(null);
        state.tiempos[state.moduloActual] = 0;
        state.completado[state.moduloActual] = false;
        state.preguntaActual = 0;
        state.showHint = false;
        state.isPaused = false;

        for (let j = state.moduloActual + 1; j < 3; j++) {
            state.completado[j] = false;
            state.respuestas[j] = Array(10).fill(null);
            state.tiempos[j] = 0;
        }

        renderTabs();
        renderCurrent();
        updateTimerDisplay();
        save();
    }

    function renderCurrent() {
        const container = document.getElementById('current-card');
        if (!container) return;
        
        container.classList.remove('fade-in');
        void container.offsetWidth;
        container.classList.add('fade-in');

        const mIdx = state.moduloActual;

        if (!state.started) {
            renderInstructions(container);
        } else if (state.completado.every(c => c)) {
            renderFinalStats(container);
        } else if (state.completado[mIdx]) {
            renderModuleStats(container);
        } else {
            renderQuiz(container);
        }
        save();
    }

    function renderInstructions(container) {
        container.innerHTML = `
            <div class="stats-panel">
                <i data-lucide="eye" size="64" style="color:var(--primary); margin-bottom:1rem"></i>
                <h1>Entrenamiento de Series Espaciales</h1>
                <p style="font-size:1.1rem; color:var(--text-muted); margin-bottom:2rem">Domina la percepción visual y el análisis de patrones geométricos</p>
                
                <div class="info-box" style="text-align:left; border-color:var(--warning); margin-bottom:1.5rem">
                    <h3 style="margin-top:0">Reglas del entrenamiento:</h3>
                    <ul style="padding-left:1.5rem">
                        <li><strong>Requisito:</strong> Necesitas <strong>9/10 aciertos</strong> para avanzar al siguiente nivel.</li>
                        <li><strong>Progresión:</strong> Los niveles se desbloquean secuencialmente (Fundamentos → Patrones Complejos → Conteo de Figuras).</li>
                        <li><strong>Reinicio automático:</strong> Si obtienes 8 o menos, el módulo se reinicia para que sigas practicando.</li>
                        <li><strong>Tiempo:</strong> Cada nivel tiene su propio cronómetro.</li>
                    </ul>
                </div>
                
                <button class="btn btn-primary" style="width:100%; height:50px; font-size:1.1rem" onclick="state.started=true; renderCurrent()">
                    Comenzar Análisis Visual
                </button>
            </div>
        `;
        lucide.createIcons();
    }

    function renderQuiz(container) {
        const qData = modulos[state.moduloActual].preguntas[state.preguntaActual];
        const userAns = state.respuestas[state.moduloActual][state.preguntaActual];
        const prog = ((state.preguntaActual + 1) / 10) * 100;

        container.innerHTML = `
            <div class="module-header">
                <div class="module-title">${state.moduloActual + 1}. ${SUBINDICES[state.moduloActual]}</div>
                <button class="btn btn-outline" onclick="resetModule()" style="padding: 6px 12px; font-size: 0.8rem; height: auto;">
                    <i data-lucide="rotate-ccw" size="14"></i> Reiniciar
                </button>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${prog}%"></div></div>
            
            <div class="question-text">${qData.q}</div>
            
            <div class="options-grid">
                ${qData.o.map((opt, i) => {
                    let cls = 'option-btn';
                    if (userAns !== null) {
                        if (i === qData.c) cls += ' correct';
                        else if (i === userAns) cls += ' incorrect';
                    }
                    return `<button class="${cls}" onclick="selectOption(${i})" ${userAns !== null ? 'disabled' : ''}>
                        <div class="letter">${String.fromCharCode(65 + i)}</div><span>${opt}</span>
                    </button>`;
                }).join('')}
            </div>
            ${state.showHint && userAns === null ? `<div class="info-box hint-box fade-in"><strong>💡 Pista Visual:</strong> ${qData.h}</div>` : ''}
            ${userAns !== null ? `<div class="info-box explanation-box fade-in"><strong>📘 Análisis CyberEdu:</strong> ${qData.e}</div>` : ''}
            <div class="actions" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="prevQ()" ${state.preguntaActual === 0 ? 'disabled' : ''}><i data-lucide="chevron-left"></i> Anterior</button>
                ${userAns === null ? `<button class="btn btn-outline" onclick="toggleHint()"><i data-lucide="lightbulb"></i> Pista</button>` : '<span></span>'}
                <button class="btn btn-primary" onclick="nextQ()" ${userAns === null ? 'disabled' : ''}>
                    ${state.preguntaActual === 9 ? 'Finalizar Módulo' : 'Siguiente'} <i data-lucide="chevron-right"></i>
                </button>
            </div>
        `;
        lucide.createIcons();
    }

    function toggleHint() {
        state.showHint = !state.showHint;
        renderCurrent();
    }

    function selectOption(i) {
        state.respuestas[state.moduloActual][state.preguntaActual] = i;
        renderCurrent();
    }

    function nextQ() {
        if (state.preguntaActual < 9) {
            state.preguntaActual++;
            state.showHint = false;
            renderCurrent();
        } else {
            const moduleAns = state.respuestas[state.moduloActual];
            const moduleQuestions = modulos[state.moduloActual].preguntas;
            const score = moduleAns.filter((a, i) => a === moduleQuestions[i].c).length;
            const perc = score * 10;

            if (perc > 80) {
                state.completado[state.moduloActual] = true;
                renderTabs();
                renderCurrent();
            } else {
                alert(`❌ PRECISIÓN VISUAL INSUFICIENTE: ${score}/10 (${perc}%).\n\nNecesitas mínimo 9 aciertos para avanzar. El módulo se reiniciará.`);
                resetModule(true);
            }
        }
    }

    function prevQ() {
        if (state.preguntaActual > 0) {
            state.preguntaActual--;
            state.showHint = false;
            renderCurrent();
        }
    }

    function renderModuleStats(container) {
        const moduleAns = state.respuestas[state.moduloActual];
        const moduleQuestions = modulos[state.moduloActual].preguntas;
        const score = moduleAns.filter((a, i) => a === moduleQuestions[i].c).length;
        const time = state.tiempos[state.moduloActual];
        const perc = score * 10;

        container.innerHTML = `
            <div class="stats-panel">
                <h2>✅ ¡Nivel Espacial Superado!</h2>
                <p>Has dominado: <strong>${SUBINDICES[state.moduloActual]}</strong></p>
                <div class="stat-circle high"><div>${score}/10</div><small>${perc}%</small></div>
                <p>Tiempo: <strong>${Math.floor(time / 60)}m ${time % 60}s</strong></p>
                
                <div class="review-list">
                    ${moduleQuestions.map((q, i) => `
                        <div class="review-item" onclick="toggleRev(${i})">
                            <span style="font-weight:600">Pregunta ${i + 1}</span>
                            <span>${moduleAns[i] === q.c ? '<b style="color:var(--secondary)">Correcta ✅</b>' : '<b style="color:var(--danger)">Incorrecta ❌</b>'} <i data-lucide="chevron-down" size="14"></i></span>
                        </div>
                        <div id="rev-${i}" class="info-box explanation-box" style="display:none; text-align:left; margin:5px 10px 15px 10px;">
                            <strong>Respuesta Correcta:</strong> ${q.o[q.c]}<br>
                            <strong>Análisis Visual:</strong> ${q.e}
                        </div>
                    `).join('')}
                </div>

                <div class="info-box" style="text-align:left; border-color:var(--secondary)">
                    <strong>🎯 Siguiente paso:</strong> Continúa al siguiente nivel de complejidad visual.
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 2rem;">
                    <button class="btn btn-outline" onclick="resetModule()"><i data-lucide="rotate-ccw"></i> Reintentar</button>
                    ${state.moduloActual < 2 ? 
                        `<button class="btn btn-primary" onclick="changeModule(${state.moduloActual + 1})">Siguiente Nivel <i data-lucide="chevron-right"></i></button>` : 
                        `<button class="btn btn-primary" onclick="renderCurrent()">Ver Reporte Global <i data-lucide="award"></i></button>`
                    }
                </div>
            </div>
        `;
        lucide.createIcons();
    }

    function toggleRev(i) {
        const el = document.getElementById(`rev-${i}`);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function renderFinalStats(container) {
        const scores = state.respuestas.map((ans, si) => ans.filter((a, qi) => a === modulos[si].preguntas[qi].c).length);
        const totalScore = scores.reduce((a, b) => a + b, 0);
        const totalTime = state.tiempos.reduce((a, b) => a + b, 0);

        if (totalScore >= 27) triggerConfetti();

        container.innerHTML = `
            <div class="stats-panel">
                <h1>🏆 REPORTE FINAL - SERIES ESPACIALES</h1>
                <div class="stat-circle high" style="width:140px; height:140px; font-size:2rem">
                    ${totalScore}/30<small>${Math.round(totalScore * 100 / 30)}%</small>
                </div>
                <p>Tiempo total: <strong>${Math.floor(totalTime / 60)} min ${totalTime % 60} seg</strong></p>
                
                <table>
                    <thead><tr><th style="text-align:left">Nivel</th><th>Aciertos</th><th>Tiempo</th><th>%</th></tr></thead>
                    <tbody>
                        ${SUBINDICES.map((n, i) => `
                            <tr>
                                <td style="text-align:left">${n}</td>
                                <td>${scores[i]}/10</td>
                                <td>${Math.floor(state.tiempos[i] / 60)}:${(state.tiempos[i] % 60).toString().padStart(2, '0')}</td>
                                <td>${scores[i] * 10}%</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <div style="margin-top: 2rem; display: flex; gap: 15px; justify-content: center;">
                    <button class="btn btn-danger-outline" onclick="clearAll()"><i data-lucide="refresh-cw"></i> Reiniciar Entrenamiento</button>
                    <button class="btn btn-primary" onclick="window.print()"><i data-lucide="printer"></i> Imprimir Resultados</button>
                </div>

                <div class="info-box" style="margin-top:2rem; border-color:var(--warning)">
                    <strong>🎓 ¡Felicidades!</strong> Has completado el entrenamiento de Series Espaciales. 
                    Ahora dominas la percepción visual y el análisis de patrones geométricos.
                </div>
            </div>
        `;
        lucide.createIcons();
    }

    function clearAll() {
        if (confirm("¿Seguro que quieres borrar todo el progreso del entrenamiento?")) {
            localStorage.removeItem('ecoems_2026_series_espaciales');
            location.reload();
        }
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confetti');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = Array(200).fill().map(() => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 6 + 4,
            c: `hsl(${Math.random() * 360}, 80%, 60%)`,
            v: Math.random() * 4 + 2
        }));
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath(); ctx.fillStyle = p.c; ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
                p.y += p.v; if (p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    window.onload = init;
    window.resetModule = resetModule;
    window.togglePause = togglePause;
    window.toggleTheme = toggleTheme;
    window.changeModule = changeModule;
    window.selectOption = selectOption;
    window.nextQ = nextQ;
    window.prevQ = prevQ;
    window.toggleHint = toggleHint;
    window.toggleRev = toggleRev;
    window.clearAll = clearAll;
</script>
</body>
</html>
